<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14" />
      <stop offset="50%" stop-color="#121629" />
      <stop offset="100%" stop-color="#090b12" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg)" />
  <circle cx="150" cy="80" r="280" fill="url(#glow)" />
  <circle cx="1050" cy="340" r="220" fill="url(#glow)" />

  <!-- Subtle Grid Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="350" y1="0" x2="350" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="950" y1="0" x2="950" y2="420" />
  </g>

  <!-- Card Container -->
  <g transform="translate(60, 45)">
    <!-- Logo Badge -->
    <rect x="0" y="10" width="84" height="84" rx="20" fill="#1e2238" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)" />
    <!-- Antigravity icon symbol -->
    <path d="M42 26 L66 68 L18 68 Z" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linejoin="round" />
    <circle cx="42" cy="54" r="6" fill="#38bdf8" />

    <!-- Badges Top Right -->
    <g transform="translate(670, 15)">
      <!-- Windows Badge -->
      <rect x="0" y="0" width="105" height="28" rx="14" fill="#171b30" stroke="#334155" stroke-width="1"/>
      <text x="52" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🪟 Windows</text>
      
      <!-- macOS Badge -->
      <rect x="115" y="0" width="95" height="28" rx="14" fill="#171b30" stroke="#334155" stroke-width="1"/>
      <text x="162" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🍏 macOS</text>
      
      <!-- Linux Badge -->
      <rect x="220" y="0" width="95" height="28" rx="14" fill="#171b30" stroke="#334155" stroke-width="1"/>
      <text x="267" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🐧 Linux</text>
      
      <!-- Dual Lang Badge -->
      <rect x="325" y="0" width="85" height="28" rx="14" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
      <text x="367" y="18" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">EN / FA</text>
    </g>

    <!-- Main Title -->
    <text x="105" y="55" fill="url(#accent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">Antigravity 403 / 503 Fixer</text>
    <text x="105" y="86" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">Google Gemini &amp; Antigravity VALIDATION_REQUIRED Auto-Resolver</text>

    <!-- Persian Title / Tagline -->
    <text x="1080" y="145" fill="#e2e8f0" font-family="Tahoma, 'Segoe UI', sans-serif" font-size="20" font-weight="700" direction="rtl" text-anchor="end">حل خودکار ارور ۴۰۳، ۵۰۳ و خطای لایسنس #3501 در Google Antigravity</text>
    <text x="1080" y="175" fill="#64748b" font-family="Tahoma, 'Segoe UI', sans-serif" font-size="14" direction="rtl" text-anchor="end">استخراج آنی لینک تایید هویت انسان (Captcha / Validation URL) و ریست سشن برای تمام پلتفرم‌ها</text>

    <!-- Highlight Feature Pill Boxes -->
    <g transform="translate(0, 205)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="345" height="90" rx="14" fill="#13172c" stroke="#1e293b" stroke-width="1" filter="url(#shadow)"/>
      <circle cx="35" cy="45" r="18" fill="#0284c7" fill-opacity="0.2"/>
      <text x="35" y="51" fill="#38bdf8" font-family="sans-serif" font-size="18" text-anchor="middle">⚡</text>
      <text x="70" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Auto URL Extraction</text>
      <text x="70" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Finds validation_url from error logs</text>

      <!-- Pill 2 -->
      <rect x="365" y="0" width="345" height="90" rx="14" fill="#13172c" stroke="#1e293b" stroke-width="1" filter="url(#shadow)"/>
      <circle cx="400" cy="45" r="18" fill="#10b981" fill-opacity="0.2"/>
      <text x="400" y="51" fill="#34d399" font-family="sans-serif" font-size="18" text-anchor="middle">🔓</text>
      <text x="435" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Instant Unblock</text>
      <text x="435" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Opens direct Google captcha in 1-click</text>

      <!-- Pill 3 -->
      <rect x="730" y="0" width="350" height="90" rx="14" fill="#13172c" stroke="#1e293b" stroke-width="1" filter="url(#shadow)"/>
      <circle cx="765" cy="45" r="18" fill="#a855f7" fill-opacity="0.2"/>
      <text x="765" y="51" fill="#c084fc" font-family="sans-serif" font-size="18" text-anchor="middle">🔄</text>
      <text x="800" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Zero Dependencies</text>
      <text x="800" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Pure Python stdlib, PowerShell &amp; Bash</text>
    </g>
  </g>
</svg>
